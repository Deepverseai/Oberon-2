name: Build Android APKs (Debug & Release)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_debug:
        description: 'Build Debug APK'
        required: true
        type: boolean
        default: true
      build_release:
        description: 'Build Release APK'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APKs
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found. Generating wrapper..."
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Prepare Environment File (.env)
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Configure Keystore for Release Build
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using release keystore provided via KEYSTORE_BASE64 secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [ -f "my-upload-key.jks" ]; then
            echo "Found existing my-upload-key.jks in repository..."
            echo "KEYSTORE_PATH=my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV
          else
            echo "No custom keystore provided. Generating self-signed keystore for release artifact..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Oberon, OU=CI, O=Deepverse, L=City, ST=State, C=US"
            echo "KEYSTORE_PATH=my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_debug }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_release }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Package APKs into Zip
        run: |
          mkdir -p output-apks

          # Copy debug APK if produced
          if [ -d "app/build/outputs/apk/debug" ]; then
            find app/build/outputs/apk/debug -name "*.apk" -exec cp {} output-apks/Oberon-debug.apk \;
          fi

          # Copy release APK if produced
          if [ -d "app/build/outputs/apk/release" ]; then
            find app/build/outputs/apk/release -name "*.apk" -exec cp {} output-apks/Oberon-release.apk \;
          fi

          echo "Listing packaged APK files:"
          ls -lh output-apks/

          # Create a standalone zip file containing the APKs
          cd output-apks
          zip -r ../Oberon-APKs.zip ./*.apk
          cd ..

      - name: Upload APKs Artifact (Zipped)
        uses: actions/upload-artifact@v4
        with:
          name: Oberon-APKs
          path: |
            output-apks/*.apk
            Oberon-APKs.zip
          retention-days: 14

      - name: Generate Build Summary
        run: |
          echo "## 🚀 Android Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Generated APK Files:" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | SHA256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY

          for file in output-apks/*.apk; do
            if [ -f "$file" ]; then
              FILENAME=$(basename "$file")
              FILESIZE=$(ls -lh "$file" | awk '{print $5}')
              CHECKSUM=$(sha256sum "$file" | awk '{print $1}')
              echo "| \`$FILENAME\` | $FILESIZE | \`$CHECKSUM\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 How to download your ZIP:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Actions** tab of this repository." >> $GITHUB_STEP_SUMMARY
          echo "2. Click on this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "3. Scroll down to the **Artifacts** section." >> $GITHUB_STEP_SUMMARY
          echo "4. Click on **Oberon-APKs** to download the ZIP file containing both Debug and Release APKs." >> $GITHUB_STEP_SUMMARY
